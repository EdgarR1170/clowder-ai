id: novel-creation
domain: creative-writing
label: Clowder Novel 0-7 Guided Multi-Cat Creation SOP
description: 风格库导入 → 创建小说 → 6模块分别选参照小说 → 设定+前三章多猫拆解 → 5大纲→5细纲→生成正文 → 人工建议调整 → 去AI味优化 → 最终成品编辑
stages:
  - id: module_reference_selection
    label: 导入参考书并按 6 大模块选择参照风格
    suggested_skill: novel-book-dissector
    hard_rules:
      - id: novel-no-verbatim-plagiarism
        text: 各模块参照小说仅提取可迁移叙事节拍、分镜框架与句法节奏，严禁搬运原书人名地名与专有设定。
        severity: blocker
    pitfalls: []
  - id: onboarding_dissection
    label: 设定与前三章多猫拆解分析
    suggested_skill: novel-chapter-copilot
    hard_rules:
      - id: novel-preserve-seed-chapters
        text: 必须忠实保留并解析用户粘贴的前三章原文与人物伏笔状态，提取作者本人原生文风作为后续生章与去AI味标尺。
        severity: blocker
    pitfalls: []
  - id: two_tier_five_options_drafting
    label: 五大纲方向 → 五细纲 → 多猫生成下一章
    suggested_skill: novel-chapter-copilot
    hard_rules:
      - id: novel-five-distinct-options
        text: 每次生成的 5 个本章大纲方向与 5 套本章细纲必须拉开实质叙事差异，并严格承接上一章末尾状态。
        severity: blocker
    pitfalls: []
  - id: human_revision_and_humanize
    label: 人工建议多轮调整与去AI味专项优化
    suggested_skill: novel-humanizer-zh
    hard_rules:
      - id: novel-zero-fact-drift-in-humanize
        text: 去AI味阶段只消除AI套话、排比腔与机械句长，严禁擅自篡改作者在人工调整阶段已确认的剧情事实。
        severity: blocker
    pitfalls: []
