id: novel-creation
domain: creative-writing
label: Clowder Novel Human-Guided Chapter Co-Pilot SOP
description: 作者主导主线大纲、章前 5 方向提问拍板、参照小说文风模拟、章后反向沉淀总结大纲与设定、以及任意章节双模式回溯衔接标准流程
stages:
  - id: style_reference_ingest
    label: 参照小说入库与文风画像提取
    suggested_skill: novel-book-dissector
    hard_rules:
      - id: novel-reference-style-boundary
        text: 参照小说仅用于下一章生成前的 5 方向冲突节拍启发与单章句法文风模拟，严禁搬运原书人名地名设定或篡改作者主线大纲。
        severity: blocker
    pitfalls: []
  - id: pre_chapter_5_directions
    label: 章前上下文组装与 5 方向提问提案
    suggested_skill: novel-chapter-copilot
    hard_rules:
      - id: novel-snapshot-isolation
        text: 构思第 K 章方向时必须严格读取第 K-1 章末设定快照与前文总结链；若为保留后文的回溯重写，必须同时满足第 K+1 章开头衔接锚点。
        severity: blocker
    pitfalls: []
  - id: guided_chapter_drafting
    label: 按作者选定思路与参照文风生成正文
    suggested_skill: novel-chapter-copilot
    hard_rules:
      - id: novel-seamless-upstream-bridge
        text: 新章节开篇必须无缝紧接上一章结尾切片与人物伤势持有物状态，禁止出现死人复活或知情权越界穿帮。
        severity: blocker
    pitfalls: []
  - id: finalize_and_reverse_distill
    label: 作者审阅定稿与反向总结沉淀大纲设定
    suggested_skill: novel-chapter-copilot
    hard_rules:
      - id: novel-faithful-reverse-summary
        text: 章后生成的总结式大纲与设定增量必须 100% 忠于作者确认定稿后的最终正文，严禁覆盖作者手写主线大纲。
        severity: blocker
    pitfalls: []
